<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joshua Moore — Technical Artist</title>
  <meta name="description" content="Portfolio of Joshua Moore, a Technical Artist specializing in shaders, real-time VFX, and artist tools. Game Development at SCAD.">
  <meta name="theme-color" content="#111214">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Joshua Moore — Technical Artist">
  <meta property="og:description" content="Shaders, real-time VFX, and artist tools. Game Development at SCAD.">
  <meta property="og:url" content="https://www.joshuamoore3d.com/">
  <meta property="og:image" content="https://static.wixstatic.com/media/34fe06_b3c6b775a50a462587d87edc7b117d19~mv2.jpg/v1/fill/w_1200,h_630,al_c,q_85/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="https://static.wixstatic.com/media/34fe06_97cfa243324f4d9ba4bf62c6ed4bf573~mv2.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Page text, projects and sections all come from js/content.js — edit them with the site editor (edit-site.bat). -->
  <a class="skip-link" href="#portfolio">Skip to portfolio</a>

  <!-- Slim nav that slides in once the hero is scrolled past -->
  <header class="topbar" id="topbar">
    <a class="topbar__mark" href="#home" aria-label="Back to top"><img data-logo alt="Logo"></a>
    <nav class="topbar__links" id="topbar-links" aria-label="Primary"></nav>
  </header>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero" id="home">
      <div class="hero__inner">
        <div class="hero__intro">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 class="hero__name" id="hero-name"></h1>
          <p class="hero__role" id="hero-role"></p>
          <p class="hero__sub" id="hero-tagline"></p>

          <nav class="hero__menu" aria-label="Sections">
            <a class="menu-btn" href="#portfolio"><span class="menu-btn__idx">01</span>Portfolio</a>
            <a class="menu-btn" href="#about"><span class="menu-btn__idx">02</span>About Me</a>
            <a class="menu-btn" href="#contact"><span class="menu-btn__idx">03</span>Contact</a>
            <a class="menu-btn" data-resume target="_blank" rel="noopener"><span class="menu-btn__idx">04</span>Resume<span class="menu-btn__ext" aria-hidden="true">↗</span></a>
          </nav>
        </div>

        <div class="hero__logo">
          <img data-logo alt="Logo" width="420" height="442">
        </div>
      </div>

      <a class="scroll-cue" href="#portfolio" aria-label="Scroll to portfolio"><span></span></a>
    </section>

    <!-- ============ PORTFOLIO ============ -->
    <section class="showcase" id="portfolio">
      <div class="section-head">
        <p class="eyebrow">Selected work</p>
        <h2 class="section-title">Portfolio</h2>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Project categories"></div>

      <div class="showcase__body">
        <div class="grid" id="grid" role="tabpanel"></div>
        <article class="detail" id="detail" hidden></article>
      </div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="about" id="about">
      <div class="section-head">
        <p class="eyebrow">Who I am</p>
        <h2 class="section-title">About Me</h2>
      </div>

      <div class="about__grid">
        <div class="about__text">
          <p class="about__lead" id="about-lead"></p>
          <div id="about-paras"></div>
          <ul class="facts" id="about-facts"></ul>
        </div>
        <div class="toolbox" id="about-toolbox"></div>
      </div>
    </section>

    <!-- ============ CUSTOM SECTIONS (added in the editor) ============ -->
    <div id="custom-sections"></div>

    <!-- ============ CONTACT ============ -->
    <section class="contact" id="contact">
      <div class="section-head">
        <p class="eyebrow">Get in touch</p>
        <h2 class="section-title">Contact</h2>
      </div>

      <div class="contact__card">
        <p class="contact__pitch" id="contact-pitch"></p>
        <a class="contact__email" id="contact-email"></a>
        <div class="contact__links" id="contact-links"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year">2026</span> <span id="footer-name"></span></span>
    <span class="footer__note">Hosted on GitHub Pages</span>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
